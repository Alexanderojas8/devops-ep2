name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-java:
    name: Pruebas Java (JaCoCo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicio-java
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Dar permiso a mvnw
        run: chmod +x mvnw

      - name: Ejecutar pruebas
        run: ./mvnw -B test

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: servicio-java/target/site/jacoco

  test-python:
    name: Pruebas Python (PyTest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicio-python
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: servicio-python/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: pytest

  snyk-seguridad:
    name: Análisis de seguridad (Snyk)
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias de Python
        run: pip install -r servicio-python/requirements.txt

      - name: Instalar Snyk CLI
        uses: snyk/actions/setup@master

      - name: Dar permiso a mvnw
        run: chmod +x servicio-java/mvnw

      - name: Escanear servicio Java (bloquea si hay severidad alta o crítica)
        working-directory: servicio-java
        run: snyk test --file=pom.xml --severity-threshold=high

      - name: Escanear servicio Python (bloquea si hay severidad alta o crítica)
        working-directory: servicio-python
        run: snyk test --file=requirements.txt --package-manager=pip --severity-threshold=high

  build-docker:
    name: Construir imágenes Docker
    runs-on: ubuntu-latest
    needs: [test-java, test-python, snyk-seguridad]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ghcr.io/alexanderojas8/devops-ep2
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen Java
        uses: docker/build-push-action@v6
        with:
          context: ./servicio-java
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-java:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-java:latest

      - name: Construir y publicar imagen Python
        uses: docker/build-push-action@v6
        with:
          context: ./servicio-python
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-python:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-python:latest
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-java:
    name: Pruebas Java (JaCoCo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicio-java
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Dar permiso a mvnw
        run: chmod +x mvnw

      - name: Ejecutar pruebas
        run: ./mvnw -B test

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: servicio-java/target/site/jacoco

  test-python:
    name: Pruebas Python (PyTest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicio-python
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: servicio-python/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: pytest